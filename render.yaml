# Render blueprint: New → Blueprint → pick this repository → Apply. Every push to main then rebuilds and
# restarts the server. The free plan has 0.1 CPU and 512 MB, sleeps after 15 minutes with nobody connected,
# and keeps no disk (saved ships reset when the server restarts or redeploys).
services:
  - type: web
    name: notdred
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      # The GitHub Pages copy of the game page may connect to this server.
      - key: ALLOWED_ORIGINS
        value: https://gameupstudios.github.io
      # Unlocks the developer menu; Render generates it (see the service's Environment tab).
      - key: DEV_TOKEN
        generateValue: true
      # Light settings for 0.1 CPU / 512 MB.
      - key: CLASSIC_MAX
        value: "1"
      - key: CLASSIC_FPS
        value: "10"
      - key: MAX_LOADED_SHIPS
        value: "6"
