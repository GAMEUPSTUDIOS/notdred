# Keeps the gh-pages branch (the GitHub Pages play page) in step with dist/ on main.
name: Update play page
on:
  push:
    branches: [main]
    paths: ['dist/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy dist/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f dist/source.zip
          git fetch --depth=1 origin gh-pages
          git worktree add pages origin/gh-pages
          cd pages
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll -exec rm -rf {} +
          cp -r ../dist/. .
          touch .nojekyll
          git add -A
          git diff --cached --quiet && echo "Play page already up to date" && exit 0
          git commit -m "Play page from main ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
