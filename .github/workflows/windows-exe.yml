# Builds notdred.exe — the all-in-one Windows host (Node, the game, the native physics module and cloudflared in one
# file) — tests it (server, page, joining a ship, and the public Cloudflare link), and publishes it to the
# "windows-latest" release: https://github.com/GAMEUPSTUDIOS/notdred/releases/tag/windows-latest
name: Windows exe
on:
  push:
    branches: [main]
    paths: ['dist/**', 'server/**', 'native/**', 'scripts/exe/**', 'scripts/build-exe.cjs', 'package.json', 'package-lock.json', '.github/workflows/windows-exe.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-exe
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: npm ci --omit=optional --no-audit --no-fund
      - name: Build the physics engine (Visual Studio)
        run: npx --yes node-gyp@10 rebuild --directory native
      - name: Get cloudflared for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest -UseBasicParsing https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile build/cloudflared.exe
      - name: Build notdred.exe
        run: node scripts/build-exe.cjs --physics native/build/Release/freeport_physics.node --cloudflared build/cloudflared.exe --out build/notdred.exe
      - name: Test notdred.exe (server, page, joining a ship)
        run: node scripts/exe/smoke.cjs build/notdred.exe
      - name: Test the public Cloudflare link
        run: node scripts/exe/smoke.cjs build/notdred.exe --tunnel
      - uses: actions/upload-artifact@v4
        with:
          name: notdred-windows
          path: build/notdred.exe
          retention-days: 14
      - name: Publish to the windows-latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          gh release delete windows-latest --cleanup-tag --yes 2>$null
          $notes = "notdred.exe built from $sha. Double-click it to host the game: it starts the server, prints a public link (Cloudflare) to share, and opens the game in your browser. Saves are kept in %LOCALAPPDATA%\notdred\data. Windows may warn that it's from an unknown publisher (it isn't signed): More info, Run anyway."
          gh release create windows-latest build/notdred.exe --title "notdred.exe (Windows, latest)" --notes "$notes" --target "${{ github.sha }}" --latest
